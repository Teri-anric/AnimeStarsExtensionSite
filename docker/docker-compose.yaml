x-backend-app: &backend-app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  volumes:
    - ../backend/app:/app/app
    - ../backend/migration:/app/migration
    - ../cookies:/cookies:rw
  env_file:
    - .env
  environment:
    - DATABASE__HOST=db

x-frontend-app: &frontend-app
  build:
    context: ..
    dockerfile: docker/Dockerfile.frontend
    target: development
  env_file:
    - .env
  volumes:
    - ../frontend:/app
    - frontend_node_modules:/app/node_modules


services:
  frontend:
    <<: *frontend-app
    command: npm run dev -- --port 3000 --host
    restart: unless-stopped
    ports:
      - "3000:3000"

  backend:
    <<: *backend-app
    command: python -m uvicorn app.web:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  scheduler:
    <<: *backend-app
    command: python -m app.scheduler
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DATABASE__USER}
      - POSTGRES_PASSWORD=${DATABASE__PASSWORD}
      - POSTGRES_DB=${DATABASE__DB}
      - POSTGRES_PORT=${DATABASE__PORT}
    expose:
      - "${DATABASE__PORT}"
    volumes:
      - ../db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  # pgadmin:
  #   image: dpage/pgadmin4
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - db
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=${PGADMIN__EMAIL}
  #     - PGADMIN_DEFAULT_PASSWORD=${PGADMIN__PASSWORD}
  #   configs:
  #     - source: pgadmin_servers
  #       target: /pgadmin4/servers.json

volumes:
  frontend_node_modules:

configs:
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "PostgreSQL",
            "Group": "Servers",
            "Host": "db",
            "Port": ${DATABASE__PORT},
            "MaintenanceDB": "${DATABASE__DB}",
            "Username": "${DATABASE__USER}",
            "Password": "${DATABASE__PASSWORD}",
            "SavePassword": true,
            "SSLMode": "prefer",
            "ConnectNow": true
          }
        }
      }
